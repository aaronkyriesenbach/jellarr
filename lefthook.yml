---
pre-commit:
  commands:
    format:
      priority: 1
      glob: '*.{ts,mjs,json,md,yml,yaml}'
      run: bunx prettier --write {staged_files}
      stage_fixed: true
    lint:
      priority: 2
      glob: '*.{ts,mjs}'
      run: bun run lint
    typecheck:
      priority: 3
      glob: '*.ts'
      run: bun run typecheck
    test:
      priority: 4
      only:
        - ref: master
      run: bun run test
