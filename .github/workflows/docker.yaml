name: Release and Build Docker Image

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  checks:
    name: Build, typecheck, lint, format, and test
    runs-on: ubuntu-latest
    # Same-repo PR branches are already covered by the push trigger.
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Test
        run: bun run test

  release-please:
    needs: checks
    if: >
      github.ref_name == 'master' &&
      needs.checks.result == 'success'
    uses: >-
      aaronkyriesenbach/workflows/.github/workflows/release-please.yaml@master
    permissions:
      contents: write
      pull-requests: write

  docker:
    needs: [checks, release-please]
    if: >
      always() && github.event_name == 'push' &&
      needs.checks.result == 'success' &&
      (github.ref_name != 'master' ||
        needs.release-please.outputs.release_created == 'true')
    uses: >-
      aaronkyriesenbach/workflows/.github/workflows/docker-build-push.yaml@master
    with:
      version: ${{ needs.release-please.outputs.version }}
    permissions:
      contents: read
      packages: write
